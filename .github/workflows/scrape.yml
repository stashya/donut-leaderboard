name: Scrape Leaderboard and Prices

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests cryptography
      
      - name: Run leaderboard scraper
        run: python scraper.py
      
      - name: Run Discord price scraper
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python discord_scraper.py
      
      - name: Encrypt data files
        env:
          ENCRYPTION_KEY_V1: ${{ secrets.ENCRYPTION_KEY_V1 }}
        run: python encrypt.py
      
      - name: Clean up unencrypted files
        run: |
          rm -f all_leaderboards.json spawner_prices.json
          rm -f top1000.json usernames.json
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add config.json data/
          git diff --staged --quiet || git commit -m "Update encrypted data $(date -u +%Y-%m-%d)"
          git push
